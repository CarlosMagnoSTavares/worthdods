name: Supabase Keep-Alive

on:
  schedule:
    - cron: "0 12 * * 1"  # Toda segunda-feira ao meio-dia UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -f "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/properties?limit=1&select=id" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            || echo "Ping failed but continuing"

      - name: Ping Backend
        run: |
          curl -f "${{ secrets.BACKEND_URL }}/health" || echo "Backend offline"
