services:
  # Main API service
  - type: web
    name: worthdods-api
    env: python
    region: oregon
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: UFS_ATIVAS
        value: SP,RJ,MG,RS,PR,SC,GO,BA

  # Cron job to keep the service awake (pings health endpoint every 10 minutes)
  - type: cron
    name: worthdods-keep-alive
    env: python
    region: oregon
    plan: free
    schedule: "*/10 * * * *"
    buildCommand: pip install requests
    command: python -c "import requests; requests.get('https://worthdods-api.onrender.com/health')"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"