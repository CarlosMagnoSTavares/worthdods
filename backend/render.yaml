services:
  - type: web
    name: worthdods-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: UFS_ATIVAS
        value: SP,RJ,MG,RS,PR,SC,GO,BA
